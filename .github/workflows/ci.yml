name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP
        run: |
          find gateway services shared config -name '*.php' -print0 | xargs -0 -n1 php -l

  ml-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps (lightweight)
        run: pip install flask flask-cors numpy
        working-directory: ml-service
      - name: Compile check
        run: python -m py_compile app.py
        working-directory: ml-service
