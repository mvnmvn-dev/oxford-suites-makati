version: "3.9"

services:
  # 1. The Machine Learning Engine
  ml-service:
    build: ./ml-service
    ports:
      - "5001:5001"
    environment:
      ML_PORT: "5001"

  # 2. The Live PHP Web Application Server
  web:
    image: php:8.2-apache
    volumes:
      - ./:/var/www/html
    ports:
      - "8080:80"
    depends_on:
      - ml-service
    # Dokploy routing rules to bind your domain to this container:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oxford-web.rule=Host(`oxfordsuitesmakati.io`)"
      - "traefik.http.routers.oxford-web.entrypoints=websecure"
      - "traefik.http.routers.oxford-web.tls=true"
      - "traefik.http.routers.oxford-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.oxford-web.loadbalancer.server.port=80"
