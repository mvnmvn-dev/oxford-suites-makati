<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reserve — Oxford Suites</title>
  <link rel="icon" href="../favicon.ico?v=2" type="image/x-icon" />
  <link rel="shortcut icon" href="../favicon.ico?v=2" type="image/x-icon" />
  <script src="../assets/js/theme-boot.js"></script>
  <script>try { if (!localStorage.getItem('oxford-rms-theme')) localStorage.setItem('oxford-rms-theme', 'light'); } catch (e) {}</script>
  <link rel="stylesheet" href="../assets/css/tailwind.css" />
  <link rel="stylesheet" href="../assets/css/app.css?v=19" />
</head>
<body class="m-0">
  <div id="app-root" data-active="reserve"></div>
  <script src="../assets/js/app.js?v=4"></script>
  <script src="../assets/js/customer-shell.js?v=4"></script>
  <script>
    RMS.mountCustomerPage({
      active: 'reserve',
      title: 'Reserve a table',
      subtitle: 'Private suites, terrace evenings, and the main dining room — the suite team will confirm shortly.',
      async render(body, user) {
        body.innerHTML = `
          <div class="grid gap-6 lg:grid-cols-[1.1fr_0.9fr]">
            <form id="form" class="space-y-3 rounded-2xl border border-[#D9CFC2] bg-[#FFFCFA] p-6 sm:p-7">
              <h2 class="font-display text-xl font-semibold">Request a booking</h2>
              <div>
                <label class="mb-1 block text-xs font-semibold text-[#6B635C]">Full name</label>
                <input id="name" required class="field" value="${user.name || ''}" />
              </div>
              <div>
                <label class="mb-1 block text-xs font-semibold text-[#6B635C]">Email</label>
                <input id="email" type="email" class="field" value="${user.email || ''}" />
              </div>
              <div>
                <label class="mb-1 block text-xs font-semibold text-[#6B635C]">Phone</label>
                <input id="phone" class="field" value="${user.phone || ''}" />
              </div>
              <div>
                <label class="mb-1 block text-xs font-semibold text-[#6B635C]">Party size</label>
                <input id="party" type="number" min="1" max="20" value="2" required class="field" />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="mb-1 block text-xs font-semibold text-[#6B635C]">Date</label>
                  <input id="date" type="date" required class="field" min="" />
                </div>
                <div>
                  <label class="mb-1 block text-xs font-semibold text-[#6B635C]">Time</label>
                  <input id="time" type="time" value="19:00" required class="field" />
                </div>
              </div>
              <div>
                <label class="mb-1 block text-xs font-semibold text-[#6B635C]">Seating preference</label>
                <select id="seating" class="field">
                  <option value="any">Any</option>
                  <option value="indoor">Indoor</option>
                  <option value="outdoor">Outdoor / terrace</option>
                  <option value="window">Window seat</option>
                </select>
              </div>
              <div>
                <label class="mb-1 block text-xs font-semibold text-[#6B635C]">Preferred table (optional)</label>
                <select id="table-id" class="field"><option value="">Auto-assign</option></select>
                <button type="button" id="btn-load-tables" class="btn-secondary mt-2 !text-xs">Refresh available tables</button>
              </div>
              <div>
                <label class="mb-1 block text-xs font-semibold text-[#6B635C]">Notes</label>
                <textarea id="notes" rows="3" class="field" placeholder="Occasion, allergies…"></textarea>
              </div>
              <p id="msg" class="text-sm"></p>
              <button type="submit" class="btn-primary w-full py-3">Submit reservation</button>
            </form>

            <div>
              <div class="mb-4 rounded-2xl border border-[#D9CFC2] bg-[#FFFCFA] p-5">
                <div class="mb-3 flex flex-wrap items-center gap-2">
                  <button type="button" id="cal-prev" class="btn-secondary !text-xs">‹</button>
                  <button type="button" id="cal-next" class="btn-secondary !text-xs">›</button>
                  <strong id="cal-month" class="font-display text-lg font-semibold"></strong>
                </div>
                <p class="mb-2 text-xs text-[#6B635C]">Tap a day to set your booking date. Your bookings are highlighted.</p>
                <div id="guest-cal" class="grid grid-cols-7 gap-px overflow-hidden rounded-xl border border-[#E8DFD0] bg-[#E8DFD0] text-center text-xs"></div>
              </div>
              <div class="rounded-2xl border border-[#D9CFC2] bg-[#FFFCFA] p-5">
                <h3 class="font-display text-lg font-semibold">Your reservations</h3>
                <div id="my-res" class="mt-3 space-y-3 text-sm text-[#6B635C]">Loading…</div>
              </div>
              <p class="mt-4 text-sm text-[#6B635C]">
                Prefer to dine now?
                <a href="${RMS.customerMenuHref()}" class="font-semibold text-[#A8342A] hover:underline">Open the menu</a>
              </p>
            </div>
          </div>

          <div id="cancel-res-modal" class="rms-modal-backdrop hidden" role="dialog" aria-modal="true">
            <div class="rms-modal max-w-sm">
              <h2 class="font-display text-xl font-semibold">Cancel reservation?</h2>
              <p class="mt-2 text-sm text-charcoal-muted">The suite desk will be notified.</p>
              <input type="hidden" id="cancel-res-id" />
              <div class="mt-5 flex justify-end gap-2">
                <button type="button" class="btn-secondary" data-modal-close>Keep it</button>
                <button type="button" id="confirm-cancel-res" class="btn-primary">Yes, cancel</button>
              </div>
            </div>
          </div>`;

        function localDateString(date = new Date()) {
          const y = date.getFullYear();
          const m = String(date.getMonth() + 1).padStart(2, '0');
          const d = String(date.getDate()).padStart(2, '0');
          return `${y}-${m}-${d}`;
        }
        function localTimeString(date = new Date()) {
          const h = String(date.getHours()).padStart(2, '0');
          const m = String(date.getMinutes()).padStart(2, '0');
          return `${h}:${m}`;
        }
        function isPastDateTime(dateStr, timeStr) {
          if (!dateStr || !timeStr) return false;
          const today = localDateString();
          if (dateStr < today) return true;
          if (dateStr > today) return false;
          const t = timeStr.length === 5 ? timeStr + ':00' : timeStr;
          const now = localTimeString() + ':00';
          return t <= now;
        }
        function syncTimeMin() {
          const dateInput = document.getElementById('date');
          const timeInput = document.getElementById('time');
          if (dateInput.value === localDateString()) {
            const minTime = localTimeString();
            timeInput.min = minTime;
            if (timeInput.value && timeInput.value <= minTime) {
              // Snap to the next whole minute after now so the slot is still bookable.
              const d = new Date();
              d.setMinutes(d.getMinutes() + 1, 0, 0);
              timeInput.value = localTimeString(d);
            }
          } else {
            timeInput.removeAttribute('min');
          }
        }
        const todayStr = localDateString();
        const dateInput = document.getElementById('date');
        dateInput.min = todayStr;
        dateInput.value = todayStr;
        syncTimeMin();
        dateInput.addEventListener('change', syncTimeMin);
        document.getElementById('time').addEventListener('change', syncTimeMin);

        let calCursor = new Date();
        calCursor.setDate(1);
        async function drawGuestCal() {
          const month = calCursor.getFullYear() + '-' + String(calCursor.getMonth() + 1).padStart(2, '0');
          document.getElementById('cal-month').textContent = calCursor.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
          let mine = [];
          try {
            const res = await RMS.api('/reservations/calendar?month=' + month + '&mine=1');
            mine = res.data || [];
          } catch (_) {}
          const byDay = {};
          mine.forEach((r) => { (byDay[r.reservation_date] = byDay[r.reservation_date] || []).push(r); });
          const firstDow = new Date(calCursor.getFullYear(), calCursor.getMonth(), 1).getDay();
          const daysInMonth = new Date(calCursor.getFullYear(), calCursor.getMonth() + 1, 0).getDate();
          const selected = document.getElementById('date').value;
          const heads = ['S','M','T','W','T','F','S'].map((d) =>
            `<div class="bg-[#F6F1E9] py-1.5 text-[10px] font-bold text-[#6B635C]">${d}</div>`
          ).join('');
          let cells = '';
          for (let i = 0; i < firstDow; i++) cells += '<div class="min-h-[52px] bg-[#FFFCFA]"></div>';
          for (let day = 1; day <= daysInMonth; day++) {
            const ds = month + '-' + String(day).padStart(2, '0');
            const has = (byDay[ds] || []).length;
            const isSel = ds === selected;
            const isToday = ds === todayStr;
            const isPast = ds < todayStr;
            cells += `<button type="button" data-cal-day="${ds}" ${isPast ? 'disabled' : ''} class="min-h-[52px] bg-[#FFFCFA] p-1 transition ${isPast ? 'cursor-not-allowed opacity-40' : 'hover:bg-[#F3ECE1]'} ${isSel ? 'ring-2 ring-inset ring-[#A8342A]' : ''}">
              <span class="inline-grid h-6 w-6 place-items-center rounded-full text-xs font-semibold ${isToday ? 'bg-[#A8342A] text-white' : isPast ? 'text-[#9A9188]' : 'text-[#241E1C]'}">${day}</span>
              ${has ? `<span class="mt-0.5 block text-[9px] font-bold text-[#A67C3A]">${has} booked</span>` : ''}
            </button>`;
          }
          document.getElementById('guest-cal').innerHTML = heads + cells;
        }
        document.getElementById('cal-prev').onclick = () => { calCursor.setMonth(calCursor.getMonth() - 1); drawGuestCal(); };
        document.getElementById('cal-next').onclick = () => { calCursor.setMonth(calCursor.getMonth() + 1); drawGuestCal(); };
        document.getElementById('guest-cal').onclick = (e) => {
          const btn = e.target.closest('[data-cal-day]');
          if (!btn || btn.disabled) return;
          if (btn.dataset.calDay < todayStr) {
            RMS.toast('Cannot book a reservation for a past date', 'error');
            return;
          }
          document.getElementById('date').value = btn.dataset.calDay;
          drawGuestCal();
          loadTables();
        };
        document.getElementById('date').addEventListener('change', () => drawGuestCal());

        async function loadTables() {
          const date = document.getElementById('date').value;
          const time = document.getElementById('time').value;
          const party = document.getElementById('party').value;
          const seating = document.getElementById('seating').value;
          const sel = document.getElementById('table-id');
          try {
            const res = await RMS.api(`/reservations/available-tables?date=${encodeURIComponent(date)}&time=${encodeURIComponent(time)}&party_size=${party}&seating_pref=${seating}`);
            const tables = (res.data || []).filter((t) => Number(t.available_slot) === 1);
            sel.innerHTML = '<option value="">Auto-assign</option>' + tables.map((t) =>
              `<option value="${t.id}">${t.table_number} · ${t.zone || t.seating_type || ''} · ${t.capacity} seats</option>`
            ).join('');
          } catch (_) {
            sel.innerHTML = '<option value="">Auto-assign</option>';
          }
        }
        document.getElementById('btn-load-tables').onclick = loadTables;
        document.getElementById('date').onchange = loadTables;
        document.getElementById('time').onchange = loadTables;
        document.getElementById('party').onchange = loadTables;
        document.getElementById('seating').onchange = loadTables;
        await loadTables();
        await drawGuestCal();

        RMS.bindModalDismiss('cancel-res-modal');
        document.getElementById('confirm-cancel-res').onclick = async () => {
          const id = document.getElementById('cancel-res-id').value;
          try {
            await RMS.api(`/reservations/${id}/status`, { method: 'PATCH', body: { status: 'cancelled' } });
            RMS.closeModal('cancel-res-modal');
            RMS.toast('Reservation cancelled');
            await loadMine();
          } catch (ex) {
            RMS.toast(ex.message, 'error');
          }
        };

        async function loadMine() {
          try {
            const res = await RMS.api('/reservations?mine=1');
            const rows = res.data || [];
            document.getElementById('my-res').innerHTML = rows.length
              ? rows.slice(0, 8).map((r) => `
                <div class="rounded-xl border border-[#E8DFD0] bg-[#F6F1E9] p-3">
                  <div class="font-semibold text-[#241E1C]">${r.reservation_date} · ${(r.reservation_time || '').slice(0, 5)}</div>
                  <div class="mt-1 flex flex-wrap items-center gap-2">
                    <span>Party of ${r.party_size}</span>
                    ${RMS.statusBadge(r.status)}
                    ${['pending','confirmed'].includes(r.status) ? `<button type="button" class="btn-sm" data-cancel-res="${r.id}">Cancel</button>` : ''}
                  </div>
                </div>`).join('')
              : '<p>No reservations yet.</p>';
            document.getElementById('my-res').querySelectorAll('[data-cancel-res]').forEach((btn) => {
              btn.addEventListener('click', () => {
                document.getElementById('cancel-res-id').value = btn.dataset.cancelRes;
                RMS.openModal('cancel-res-modal');
              });
            });
          } catch (_) {
            document.getElementById('my-res').innerHTML = '<p>Could not load reservations.</p>';
          }
        }
        await loadMine();

        document.getElementById('form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const msg = document.getElementById('msg');
          const reservationDate = document.getElementById('date').value;
          const reservationTime = document.getElementById('time').value;
          if (reservationDate < localDateString()) {
            msg.className = 'text-sm text-[#A8342A]';
            msg.textContent = 'Cannot book a reservation for a past date';
            RMS.toast(msg.textContent, 'error');
            return;
          }
          if (isPastDateTime(reservationDate, reservationTime)) {
            msg.className = 'text-sm text-[#A8342A]';
            msg.textContent = 'Cannot book a reservation for a time that has already passed';
            RMS.toast(msg.textContent, 'error');
            return;
          }
          try {
            await RMS.api('/reservations', {
              method: 'POST',
              body: {
                customer_id: user.id,
                customer_name: document.getElementById('name').value,
                customer_email: document.getElementById('email').value,
                customer_phone: document.getElementById('phone').value,
                party_size: Number(document.getElementById('party').value),
                reservation_date: reservationDate,
                reservation_time: document.getElementById('time').value,
                seating_pref: document.getElementById('seating').value,
                table_id: document.getElementById('table-id').value ? Number(document.getElementById('table-id').value) : null,
                notes: document.getElementById('notes').value,
                status: 'pending',
              },
            });
            msg.className = 'text-sm text-[#6B7F5B]';
            msg.textContent = 'Reservation received. The suite team will confirm shortly.';
            RMS.toast('Reservation submitted');
            await loadMine();
          } catch (ex) {
            msg.className = 'text-sm text-[#A8342A]';
            msg.textContent = ex.message;
            RMS.toast(ex.message, 'error');
          }
        });
      },
    });
  </script>
</body>
</html>
