<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Defense Mode — Oxford Suites RMS</title>
  <link rel="icon" href="../favicon.ico?v=2" type="image/x-icon" />
  <link rel="shortcut icon" href="../favicon.ico?v=2" type="image/x-icon" />
  <script src="../assets/js/theme-boot.js"></script>
  <link rel="stylesheet" href="../assets/css/tailwind.css" />
  <link rel="stylesheet" href="../assets/css/app.css?v=17" />
</head>
<body>
  <div id="app-root" data-active="defense" data-roles="admin"></div>
  <script src="../assets/js/app.js?v=17"></script>
  <script src="../assets/js/staff-shell.js?v=10"></script>
  <script>
    RMS.mountStaffPage({
      title: 'Defense Mode',
      subtitle: 'Capstone presentation dashboard — architecture, live ops, AI, and one-click demo scenarios.',
      async render(body) {
        body.innerHTML = `
          <div class="mb-5 flex flex-wrap gap-2">
            <button type="button" class="btn-primary" data-demo="lunch_rush">Seed Lunch Rush</button>
            <button type="button" class="btn-secondary" data-demo="dinner_rush">Seed Dinner Rush</button>
            <button type="button" class="btn-secondary" data-demo="fully_booked">Seed Fully Booked</button>
            <button type="button" class="btn-secondary" data-demo="inventory_shortage">Seed Shortage</button>
          </div>
          <div id="demo-msg" class="mb-5 hidden rounded-xl border border-sage bg-sage-soft px-4 py-3 text-sm"></div>

          <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3" id="kpi-grid"></div>

          <div class="mt-6 grid gap-5 lg:grid-cols-2">
            <section class="rounded-2xl border border-line bg-parchment-light p-5">
              <h3 class="font-display text-lg font-semibold">System architecture</h3>
              <ul class="mt-3 space-y-2 text-sm text-charcoal-muted">
                <li>• PHP microservices behind a single API Gateway</li>
                <li>• Event bus + circuit breaker for resilient payments</li>
                <li>• Independent ML microservice with PHP heuristic fallback</li>
                <li>• Role-based access: Admin · Kitchen · Cashier · Customer</li>
                <li>• SSE + polling for live notification badges</li>
              </ul>
            </section>
            <section class="rounded-2xl border border-line bg-parchment-light p-5">
              <h3 class="font-display text-lg font-semibold">Live kitchen & satisfaction</h3>
              <div id="live-ops" class="mt-3 space-y-2 text-sm"></div>
            </section>
            <section class="rounded-2xl border border-line bg-parchment-light p-5">
              <h3 class="font-display text-lg font-semibold">Demand & waste intelligence</h3>
              <div id="intel" class="mt-3 space-y-2 text-sm"></div>
            </section>
            <section class="rounded-2xl border border-line bg-parchment-light p-5">
              <h3 class="font-display text-lg font-semibold">Activity feed</h3>
              <div id="feed" class="mt-3 max-h-64 space-y-2 overflow-y-auto text-sm"></div>
            </section>
          </div>`;

        async function refresh() {
          const [a, act, kit] = await Promise.all([
            RMS.api('/analytics'),
            RMS.api('/audit/activity').catch(() => ({ data: [] })),
            RMS.api('/kitchen/tickets').catch(() => ({ data: [] })),
          ]);
          const k = a.data.kpis || {};
          document.getElementById('kpi-grid').innerHTML = [
            ['Today revenue', RMS.money(k.revenue_today)],
            ['Active orders / kitchen', (k.orders_today || 0) + ' / ' + (k.kitchen_queue || 0)],
            ['Reservations today', k.reservations_today || k.pending_reservations || 0],
            ['Avg prep time', (k.avg_prep_minutes || 0) + ' min'],
            ['Waiter response', (k.avg_waiter_response_minutes || 0) + ' min'],
            ['Satisfaction', (k.customer_rating || 0) + ' / 5'],
          ].map(([l, v]) => `
            <article class="rounded-2xl border border-line bg-surface p-4">
              <p class="text-[11px] font-bold uppercase tracking-wide text-charcoal-muted">${l}</p>
              <p class="mt-2 font-display text-2xl font-semibold">${v}</p>
            </article>`).join('');

          const tickets = kit.data || [];
          const sat = a.data.satisfaction || {};
          document.getElementById('live-ops').innerHTML = `
            <p><strong>${tickets.length}</strong> open kitchen tickets · <strong>${tickets.filter((t)=>Number(t.is_overdue)).length}</strong> overdue</p>
            <p>Food ${sat.food_quality || '—'} · Service ${sat.service || '—'} · Overall ${sat.overall || '—'}</p>
            <p class="text-xs text-charcoal-muted">${(a.data.praised_items||[]).slice(0,3).map((i)=>i.name).join(' · ') || 'No praised items yet'}</p>`;

          const waste = a.data.waste_prediction || {};
          const demand = (a.data.demand_forecast || []).slice(0, 3);
          document.getElementById('intel').innerHTML = `
            <p>Waste cost (30d): <strong>${RMS.money(waste.waste_cost_30d || a.data.kpis?.waste_cost_30d)}</strong></p>
            <p>Expiring soon: <strong>${(waste.expiring_soon||[]).length}</strong> ingredients</p>
            <p class="text-xs text-charcoal-muted">Top demand: ${demand.map((d)=>d.name).join(', ') || '—'}</p>
            <p class="text-xs text-charcoal-muted">${(waste.suggested_promos||[]).slice(0,2).map((p)=>p.promo_idea).join(' · ') || ''}</p>`;

          document.getElementById('feed').innerHTML = (act.data || []).slice(0, 12).map((r) =>
            `<div class="rounded-lg border border-line bg-surface px-3 py-2"><p>${r.text}</p><p class="text-[10px] text-charcoal-muted">${r.at}</p></div>`
          ).join('') || '<p class="text-charcoal-muted">No activity yet.</p>';
        }

        body.onclick = async (e) => {
          const btn = e.target.closest('[data-demo]');
          if (!btn) return;
          try {
            const res = await RMS.api('/demo/seed', { method: 'POST', body: { scenario: btn.dataset.demo } });
            const msg = document.getElementById('demo-msg');
            msg.classList.remove('hidden');
            msg.textContent = res.message + ' · ' + JSON.stringify(res.data);
            RMS.toast('Demo scenario ready');
            await refresh();
          } catch (ex) {
            RMS.toast(ex.message, 'error');
          }
        };

        await refresh();
        setInterval(refresh, 12000);
      },
    });
  </script>
</body>
</html>
