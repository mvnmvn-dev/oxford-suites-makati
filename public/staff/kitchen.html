<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kitchen KOT — Oxford Suites RMS</title>
  <link rel="icon" href="../favicon.ico?v=2" type="image/x-icon" />
  <link rel="shortcut icon" href="../favicon.ico?v=2" type="image/x-icon" />
  <script src="../assets/js/theme-boot.js"></script>
  <link rel="stylesheet" href="../assets/css/tailwind.css" />
  <link rel="stylesheet" href="../assets/css/app.css?v=17" />
</head>
<body>
  <div id="app-root" data-active="kitchen" data-roles="admin,kitchen"></div>
  <script src="../assets/js/app.js?v=17"></script>
  <script src="../assets/js/staff-shell.js?v=10"></script>
  <script>
    let knownIds = new Set();
    let station = 'all';
    let muted = localStorage.getItem('oxford-kot-mute') === '1';
    let kotBusy = false;
    let lastBoardSignature = '';
    let kotTimer = null;

    window.bump = async function (id, status) {
      try {
        await RMS.api(`/kitchen/tickets/${id}/status`, { method: 'PATCH', body: { status } });
        const labels = { in_progress: 'Ticket started', ready: 'Ticket marked ready', bumped: 'Ticket bumped / served' };
        RMS.toast(labels[status] || 'Ticket updated');
        await loadTickets(true);
      } catch (ex) {
        RMS.toast(ex.message, 'error');
      }
    };

    function beep() {
      if (muted) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = 880;
        g.gain.value = 0.08;
        o.connect(g);
        g.connect(ctx.destination);
        o.start();
        setTimeout(() => { o.stop(); ctx.close(); }, 220);
      } catch (_) {}
    }

    const accent = { new: 'border-t-clay', in_progress: 'border-t-brass', ready: 'border-t-sage' };

    function formatClock(seconds) {
      const s = Math.max(0, Number(seconds) || 0);
      return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }

    function ticketStructureKey(t) {
      return [
        t.id,
        t.status,
        t.table_label || '',
        t.order_number || '',
        Number(t.is_overdue) === 1 ? 1 : 0,
        Number(t.is_warning) === 1 ? 1 : 0,
        t.order_notes || '',
        (t.stations || []).join(','),
        (t.items || []).map((i) => [i.quantity, i.item_name, i.status, i.allergens || '', i.notes || ''].join(':')).join('|'),
      ].join('~');
    }

    function boardSignature(tickets) {
      return tickets.map((t) => ticketStructureKey(t) + '#' + formatClock(t.elapsed_seconds) + '#' + formatClock(t.remaining_seconds)).join('||');
    }

    function ticketCard(t, animate) {
      const elapsedLabel = formatClock(t.elapsed_seconds);
      const overdue = Number(t.is_overdue) === 1;
      const warning = Number(t.is_warning) === 1;
      const remainLabel = formatClock(t.remaining_seconds);
      const borderCls = overdue ? 'border-ember bg-ember/5' : (warning ? 'border-clay bg-clay-soft/40' : 'border-line');
      return `
        <article data-ticket-id="${t.id}" class="flex flex-col rounded-2xl border ${borderCls} border-t-[3px] ${accent[t.status] || 'border-t-line'} bg-parchment-light shadow-suite transition hover:-translate-y-0.5 hover:shadow-lift${animate ? ' animate-ticket-in' : ''}">
          <div class="border-b border-dashed border-line px-4 pb-3 pt-4">
            <div class="flex items-start justify-between gap-2">
              <div>
                <h3 class="font-display text-xl font-semibold text-charcoal">${t.table_label || '—'}</h3>
                <p class="mt-0.5 text-[11px] font-medium text-charcoal-muted">${t.order_number}</p>
              </div>
              ${RMS.statusBadge(t.status)}
            </div>
            <div class="mt-2 flex flex-wrap gap-1">${(t.stations || []).map((s) => `<span class="rounded-full bg-parchment-deep px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-charcoal-muted">${s}</span>`).join('')}</div>
            <div class="mt-3 flex items-center justify-between text-xs ${overdue ? 'font-bold text-ember' : (warning ? 'font-semibold text-clay-deep' : 'text-charcoal-muted')}">
              <span data-elapsed>⏱ ${elapsedLabel} elapsed</span>
              <span data-countdown>${overdue ? 'OVERDUE' : (warning ? 'SLA warn · ' + remainLabel + ' left' : 'Countdown ' + remainLabel)}</span>
            </div>
          </div>
          <ul class="flex-1 px-4 py-2">
            ${(t.items || []).map((i) => `
              <li class="border-b border-dotted border-line/70 py-2 text-sm last:border-0">
                <div class="flex items-center justify-between gap-2">
                  <span class="font-medium text-charcoal">${i.quantity}× ${i.item_name}</span>
                  <span class="text-[11px] capitalize text-charcoal-muted">${i.status}</span>
                </div>
                ${i.allergens ? `<p class="mt-1 text-[10px] font-semibold text-ember">⚠ Allergens: ${i.allergens}</p>` : ''}
                ${i.notes ? (typeof RMS.formatMods === 'function' ? RMS.formatMods(i.notes) : `<p class="mt-1 text-[11px] text-ember">⚙ ${i.notes}</p>`) : ''}
              </li>`).join('') || '<li class="py-3 text-sm text-charcoal-muted">No items</li>'}
          </ul>
          ${t.order_notes ? `<div class="mx-4 mb-2 rounded-lg bg-ember-soft px-3 py-2 text-[11px] font-semibold text-ember">⚠ ${t.order_notes}</div>` : ''}
          <div class="mt-auto flex gap-2 border-t border-line px-4 py-3">
            ${t.status === 'new' ? `<button type="button" class="btn-brass flex-1 !rounded-xl !py-2 !text-sm" onclick="bump(${t.id},'in_progress')">Start</button>` : ''}
            ${t.status === 'in_progress' ? `<button type="button" class="btn-primary flex-1 !py-2 !text-sm" onclick="bump(${t.id},'ready')">Mark ready</button>` : ''}
            ${t.status === 'ready' ? `<button type="button" class="btn-secondary flex-1 !py-2 !text-sm" onclick="bump(${t.id},'bumped')">Bump / served</button>` : ''}
          </div>
        </article>`;
    }

    function column(title, tone, tickets, emptyHint, animateIds) {
      const bar = { clay: 'bg-clay', brass: 'bg-brass', sage: 'bg-sage' }[tone] || 'bg-line';
      return `
        <div class="flex min-h-[420px] flex-col rounded-2xl border border-line bg-surface/60">
          <div class="flex items-center justify-between border-b border-line px-4 py-3">
            <div class="flex items-center gap-2">
              <span class="h-2 w-2 rounded-full ${bar}"></span>
              <h3 class="text-sm font-semibold text-charcoal">${title}</h3>
            </div>
            <span class="rounded-full bg-parchment-deep px-2.5 py-0.5 text-[11px] font-semibold text-charcoal-muted">${tickets.length}</span>
          </div>
          <div class="flex flex-1 flex-col gap-3 overflow-y-auto p-3" data-kot-scroll>
            ${tickets.length ? tickets.map((t) => ticketCard(t, animateIds.has(t.id))).join('') : `
              <div class="flex flex-1 items-center justify-center rounded-xl border border-dashed border-line px-4 py-10 text-center text-sm text-charcoal-muted">${emptyHint}</div>`}
          </div>
        </div>`;
    }

    function updateCount(tickets) {
      const countEl = document.getElementById('kot-count');
      if (!countEl) return;
      const overdue = tickets.filter((t) => Number(t.is_overdue) === 1).length;
      countEl.textContent = tickets.length + (tickets.length === 1 ? ' open ticket' : ' open tickets') +
        (overdue ? ' · ' + overdue + ' overdue' : '');
      countEl.classList.toggle('text-ember', overdue > 0);
    }

    function patchTimers(tickets) {
      tickets.forEach((t) => {
        const card = document.querySelector(`[data-ticket-id="${t.id}"]`);
        if (!card) return;
        const overdue = Number(t.is_overdue) === 1;
        const warning = Number(t.is_warning) === 1;
        const elapsedEl = card.querySelector('[data-elapsed]');
        const countdownEl = card.querySelector('[data-countdown]');
        if (elapsedEl) elapsedEl.textContent = '⏱ ' + formatClock(t.elapsed_seconds) + ' elapsed';
        if (countdownEl) {
          countdownEl.textContent = overdue
            ? 'OVERDUE'
            : (warning ? 'SLA warn · ' + formatClock(t.remaining_seconds) + ' left' : 'Countdown ' + formatClock(t.remaining_seconds));
        }
        const timerRow = elapsedEl && elapsedEl.parentElement;
        if (timerRow) {
          timerRow.className = 'mt-3 flex items-center justify-between text-xs ' +
            (overdue ? 'font-bold text-ember' : (warning ? 'font-semibold text-clay-deep' : 'text-charcoal-muted'));
        }
      });
    }

    async function loadTickets(force) {
      if (kotBusy) return;
      kotBusy = true;
      try {
        const q = station && station !== 'all' ? '?station=' + encodeURIComponent(station) : '';
        const res = await RMS.api('/kitchen/tickets' + q);
        const board = document.getElementById('kot-board');
        if (!board) return;
        const tickets = res.data || [];
        const ids = new Set(tickets.map((t) => t.id));
        const animateIds = new Set();
        let hasNew = false;
        ids.forEach((id) => {
          if (!knownIds.has(id)) {
            hasNew = true;
            animateIds.add(id);
          }
        });
        if (knownIds.size && hasNew) beep();

        const signature = boardSignature(tickets);
        const structureNow = tickets.map(ticketStructureKey).join('||');
        const structurePrev = lastBoardSignature ? lastBoardSignature.split('||').map((p) => p.split('#')[0]).join('||') : '';
        const structureChanged = force || structureNow !== structurePrev;

        updateCount(tickets);

        if (!structureChanged && board.children.length) {
          patchTimers(tickets);
          lastBoardSignature = signature;
          knownIds = ids;
          return;
        }

        if (!force && signature === lastBoardSignature && board.children.length) {
          knownIds = ids;
          return;
        }

        const scrollTops = [...board.querySelectorAll('[data-kot-scroll]')].map((el) => el.scrollTop);
        const groups = {
          new: tickets.filter((t) => t.status === 'new'),
          in_progress: tickets.filter((t) => t.status === 'in_progress'),
          ready: tickets.filter((t) => t.status === 'ready'),
        };
        board.innerHTML = [
          column('New', 'clay', groups.new, 'No new tickets', animateIds),
          column('In progress', 'brass', groups.in_progress, 'Nothing on the pass', animateIds),
          column('Ready', 'sage', groups.ready, 'Nothing waiting to bump', animateIds),
        ].join('');
        board.querySelectorAll('[data-kot-scroll]').forEach((el, i) => {
          if (scrollTops[i] != null) el.scrollTop = scrollTops[i];
        });
        lastBoardSignature = signature;
        knownIds = ids;
      } catch (_) {
        /* keep last board on transient poll failures */
      } finally {
        kotBusy = false;
      }
    }

    RMS.mountStaffPage({
      title: 'Kitchen (KOT)',
      subtitle: 'Timers, overdue alerts, station filters, and sound on new tickets.',
      async render(body) {
        if (kotTimer) clearInterval(kotTimer);
        body.innerHTML = `
          <div class="mb-5 flex flex-wrap items-center gap-3">
            <div class="header-chip">
              <span class="h-1.5 w-1.5 animate-pulse rounded-full bg-sage"></span>
              <span id="kot-count">Loading…</span>
            </div>
            <div class="flex flex-wrap gap-1" id="station-filters">
              ${['all','grill','drinks','dessert','general'].map((s) =>
                `<button type="button" data-station="${s}" class="btn-sm ${station === s ? '!bg-ember !text-white' : ''}">${s === 'all' ? 'All' : s.charAt(0).toUpperCase() + s.slice(1)}</button>`
              ).join('')}
            </div>
            <button type="button" id="mute-toggle" class="btn-secondary !text-xs">${muted ? 'Unmute alerts' : 'Mute alerts'}</button>
            <div class="flex-1"></div>
            <button type="button" id="kot-refresh" class="btn-primary !text-xs">Refresh now</button>
          </div>
          <div id="kot-board" class="grid flex-1 gap-4 lg:grid-cols-3"></div>`;

        document.getElementById('kot-refresh').onclick = () => loadTickets(true);
        document.getElementById('mute-toggle').onclick = () => {
          muted = !muted;
          localStorage.setItem('oxford-kot-mute', muted ? '1' : '0');
          document.getElementById('mute-toggle').textContent = muted ? 'Unmute alerts' : 'Mute alerts';
        };
        document.getElementById('station-filters').onclick = (e) => {
          const btn = e.target.closest('[data-station]');
          if (!btn) return;
          station = btn.dataset.station;
          [...document.getElementById('station-filters').children].forEach((b) => {
            b.classList.toggle('!bg-ember', b.dataset.station === station);
            b.classList.toggle('!text-white', b.dataset.station === station);
          });
          lastBoardSignature = '';
          loadTickets(true);
        };
        await loadTickets(true);
        kotTimer = setInterval(() => loadTickets(false), 8000);
        window.addEventListener('rms:live', () => { loadTickets(false); });
      },
    });
  </script>
</body>
</html>
